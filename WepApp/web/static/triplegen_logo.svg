<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Subtle glow effect for nodes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="250" r="230" fill="#0D2137" />
  <circle cx="250" cy="250" r="220" fill="none" stroke="#1A3A5C" stroke-width="1.5" />

  <!-- Inner connection lines (the triple edges) -->
  <!-- Top to Bottom-Left -->
  <line x1="250" y1="145" x2="155" y2="310" stroke="#2DD4BF" stroke-width="3.5" opacity="0.7"/>
  <!-- Top to Bottom-Right -->
  <line x1="250" y1="145" x2="345" y2="310" stroke="#2DD4BF" stroke-width="3.5" opacity="0.7"/>
  <!-- Bottom-Left to Bottom-Right -->
  <line x1="155" y1="310" x2="345" y2="310" stroke="#2DD4BF" stroke-width="3.5" opacity="0.7"/>

  <!-- Secondary smaller nodes (neural network feel) -->
  <!-- Top-left satellite -->
  <line x1="250" y1="145" x2="160" y2="175" stroke="#2DD4BF" stroke-width="1.5" opacity="0.3"/>
  <circle cx="160" cy="175" r="6" fill="#2DD4BF" opacity="0.4"/>

  <!-- Top-right satellite -->
  <line x1="250" y1="145" x2="340" y2="175" stroke="#2DD4BF" stroke-width="1.5" opacity="0.3"/>
  <circle cx="340" cy="175" r="6" fill="#2DD4BF" opacity="0.4"/>

  <!-- Left satellite -->
  <line x1="155" y1="310" x2="110" y2="250" stroke="#2DD4BF" stroke-width="1.5" opacity="0.3"/>
  <circle cx="110" cy="250" r="5" fill="#2DD4BF" opacity="0.35"/>

  <!-- Right satellite -->
  <line x1="345" y1="310" x2="390" y2="250" stroke="#2DD4BF" stroke-width="1.5" opacity="0.3"/>
  <circle cx="390" cy="250" r="5" fill="#2DD4BF" opacity="0.35"/>

  <!-- Bottom satellite -->
  <line x1="250" y1="310" x2="250" y2="370" stroke="#2DD4BF" stroke-width="1.5" opacity="0.3"/>
  <circle cx="250" cy="370" r="5" fill="#2DD4BF" opacity="0.35"/>

  <!-- Cross connections (neural web) -->
  <line x1="160" y1="175" x2="110" y2="250" stroke="#2DD4BF" stroke-width="1" opacity="0.15"/>
  <line x1="340" y1="175" x2="390" y2="250" stroke="#2DD4BF" stroke-width="1" opacity="0.15"/>
  <line x1="110" y1="250" x2="250" y2="370" stroke="#2DD4BF" stroke-width="1" opacity="0.15"/>
  <line x1="390" y1="250" x2="250" y2="370" stroke="#2DD4BF" stroke-width="1" opacity="0.15"/>

  <!-- Directional arrows on main edges (predicate indicators) -->
  <!-- Arrow on top to bottom-right edge -->
  <polygon points="310,245 295,240 300,258" fill="#2DD4BF" opacity="0.6"/>
  <!-- Arrow on bottom edge -->
  <polygon points="260,310 250,296 270,296" fill="#2DD4BF" opacity="0.6" transform="rotate(90, 260, 303)"/>

  <!-- Three main nodes (the triple: Subject, Predicate, Object) -->
  <!-- Top node (Subject) - largest -->
  <circle cx="250" cy="145" r="28" fill="#0F766E" stroke="#2DD4BF" stroke-width="3" filter="url(#glow)"/>
  <circle cx="250" cy="145" r="16" fill="none" stroke="#5EEAD4" stroke-width="1.5" opacity="0.5"/>
  <!-- S label -->
  <text x="250" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">S</text>

  <!-- Bottom-Left node (Predicate) -->
  <circle cx="155" cy="310" r="24" fill="#0F766E" stroke="#2DD4BF" stroke-width="3" filter="url(#glow)"/>
  <circle cx="155" cy="310" r="13" fill="none" stroke="#5EEAD4" stroke-width="1.5" opacity="0.5"/>
  <!-- P label -->
  <text x="155" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF">P</text>

  <!-- Bottom-Right node (Object) -->
  <circle cx="345" cy="310" r="24" fill="#0F766E" stroke="#2DD4BF" stroke-width="3" filter="url(#glow)"/>
  <circle cx="345" cy="310" r="13" fill="none" stroke="#5EEAD4" stroke-width="1.5" opacity="0.5"/>
  <!-- O label -->
  <text x="345" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF">O</text>

  <!-- TripleGen text -->
  <text x="250" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="34" fill="#FFFFFF" letter-spacing="4">
    <tspan fill="#FFFFFF">TRIPLE</tspan><tspan fill="#2DD4BF">GEN</tspan>
  </text>
</svg>
