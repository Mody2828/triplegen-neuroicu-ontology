<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="2235" viewBox="0 0 980 2235">
  <defs>
    <style>
      .title { font-family: "IBM Plex Sans", Arial, sans-serif; font-size: 44px; font-weight: 700; fill: #101218; }
      .subtitle { font-family: "IBM Plex Sans", Arial, sans-serif; font-size: 22px; font-weight: 500; fill: #394150; }
      .cardTitle { font-family: "IBM Plex Sans", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .cardBody { font-family: "IBM Plex Sans", Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #4b5563; }
      .pillText { font-family: "IBM Plex Sans", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; }
      .footer { font-family: "IBM Plex Sans", Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #6b7280; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b1020" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/>
      <stop offset="1" stop-color="#eef1f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="980" height="2235" fill="url(#bg)"/>
  <g opacity="0.35" stroke="#d7ddea" stroke-width="1">
    <path d="M0 80H980M0 160H980M0 240H980M0 320H980M0 400H980M0 480H980M0 560H980M0 640H980M0 720H980M0 800H980M0 880H980M0 960H980M0 1040H980M0 1120H980M0 1200H980M0 1280H980M0 1360H980M0 1440H980M0 1520H980M0 1600H980M0 1680H980M0 1760H980M0 1840H980M0 1920H980M0 2000H980"/>
    <path d="M80 0V2235M160 0V2235M240 0V2235M320 0V2235M400 0V2235M480 0V2235M560 0V2235M640 0V2235M720 0V2235M800 0V2235M880 0V2235"/>
  </g>

  <!-- Header -->
  <text x="490" y="95" text-anchor="middle" class="title">LLM-driven Ontology Engineering</text>
  <text x="490" y="135" text-anchor="middle" class="subtitle">Experiment pipeline (BrainIT / Neuro-ICU)</text>

  <!-- 4 Pipeline Modes (user-selectable) -->
  <g filter="url(#shadow)">
    <rect x="90" y="165" width="800" height="110" rx="22" fill="#ffffff"/>
    <rect x="90" y="165" width="12" height="110" rx="22" fill="#6366f1"/>
  </g>
  <text x="125" y="198" class="cardTitle">4 Pipeline Modes &#x1F4DD;</text>
  <text x="125" y="225" class="cardBody">User-selectable; each mode is a superset of the previous.</text>
  <rect x="125" y="238" width="115" height="26" rx="13" fill="#6366f1"/>
  <text x="182" y="256" text-anchor="middle" class="pillText">1 Strict</text>
  <rect x="250" y="238" width="115" height="26" rx="13" fill="#4f46e5"/>
  <text x="307" y="256" text-anchor="middle" class="pillText">2 Guided</text>
  <rect x="375" y="238" width="175" height="26" rx="13" fill="#4338ca"/>
  <text x="462" y="256" text-anchor="middle" class="pillText">3 Schema-Completed</text>
  <rect x="560" y="238" width="155" height="26" rx="13" fill="#3730a3"/>
  <text x="637" y="256" text-anchor="middle" class="pillText">Text-grounded (built-in)</text>
  <path d="M490 295 L490 325" stroke="#14b8a6" stroke-width="5" stroke-linecap="round"/>
  <path d="M490 325 l-10 -12 M490 325 l10 -12" stroke="#14b8a6" stroke-width="5" stroke-linecap="round"/>

  <!-- Helper: card = (x=90, w=800) -->

  <!-- 1 Ingestion -->
  <g filter="url(#shadow)">
    <rect x="90" y="335" width="800" height="120" rx="22" fill="#ffffff"/>
    <rect x="90" y="335" width="12" height="120" rx="22" fill="#14b8a6"/>
  </g>
  <text x="125" y="377" class="cardTitle">1. Ingestion &#x1F4E5;</text>
  <text x="125" y="410" class="cardBody">Load text or PDF corpus. Save corpus manifest.</text>
  <text x="850" y="390" text-anchor="end" class="cardTitle">&#x1F4C4;</text>
  <path d="M490 475 L490 505" stroke="#14b8a6" stroke-width="5" stroke-linecap="round"/>
  <path d="M490 505 l-10 -12 M490 505 l10 -12" stroke="#14b8a6" stroke-width="5" stroke-linecap="round"/>

  <!-- 2 Chunking -->
  <g filter="url(#shadow)">
    <rect x="90" y="515" width="800" height="120" rx="22" fill="#ffffff"/>
    <rect x="90" y="515" width="12" height="120" rx="22" fill="#14b8a6"/>
  </g>
  <text x="125" y="557" class="cardTitle">2. Chunking &#x2702;&#xFE0F;</text>
  <text x="125" y="590" class="cardBody">Split documents into chunks for prompting.</text>
  <text x="850" y="570" text-anchor="end" class="cardTitle">&#x2702;&#xFE0F;</text>
  <path d="M490 655 L490 685" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
  <path d="M490 685 l-10 -12 M490 685 l10 -12" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>

  <!-- 3 Retrieval & MMR (conditional) -->
  <g filter="url(#shadow)">
    <rect x="90" y="695" width="800" height="140" rx="22" fill="#ffffff"/>
    <rect x="90" y="695" width="12" height="140" rx="22" fill="#3b82f6"/>
  </g>
  <text x="125" y="737" class="cardTitle">3. (Conditional) Retrieval &amp; MMR &#x1F50E;</text>
  <text x="125" y="770" class="cardBody">For one-/few-shot/phased: retrieve top examples with MMR.</text>
  <rect x="125" y="790" width="340" height="28" rx="14" fill="#2563eb"/>
  <text x="295" y="810" text-anchor="middle" class="pillText">only for one_shot / few-shot (phased_3step)</text>
  <text x="850" y="750" text-anchor="end" class="cardTitle">&#x1F50D;</text>
  <path d="M490 855 L490 885" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
  <path d="M490 885 l-10 -12 M490 885 l10 -12" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>

  <!-- 4 Prompt assembly -->
  <g filter="url(#shadow)">
    <rect x="90" y="895" width="800" height="120" rx="22" fill="#ffffff"/>
    <rect x="90" y="895" width="12" height="120" rx="22" fill="#3b82f6"/>
  </g>
  <text x="125" y="937" class="cardTitle">4. Prompt assembly &#x1F9E9;</text>
  <text x="125" y="970" class="cardBody">Compose prompt: schema/vocab constraints + examples + chunk text.</text>
  <text x="850" y="950" text-anchor="end" class="cardTitle">&#x1F9E9;</text>
  <path d="M490 1035 L490 1065" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
  <path d="M490 1065 l-10 -12 M490 1065 l10 -12" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>

  <!-- 5 LLM extraction -->
  <g filter="url(#shadow)">
    <rect x="90" y="1075" width="800" height="120" rx="22" fill="#ffffff"/>
    <rect x="90" y="1075" width="12" height="120" rx="22" fill="#f97316"/>
  </g>
  <text x="125" y="1117" class="cardTitle">5. LLM extraction &#x1F9E0;</text>
  <text x="125" y="1150" class="cardBody">Extract classes, relations, hierarchy (JSON only).</text>
  <text x="850" y="1130" text-anchor="end" class="cardTitle">&#x1F9E0;</text>
  <path d="M490 1215 L490 1245" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
  <path d="M490 1245 l-10 -12 M490 1245 l10 -12" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>

  <!-- 6 Parse & filter -->
  <g filter="url(#shadow)">
    <rect x="90" y="1255" width="800" height="120" rx="22" fill="#ffffff"/>
    <rect x="90" y="1255" width="12" height="120" rx="22" fill="#f97316"/>
  </g>
  <text x="125" y="1297" class="cardTitle">6. Parse &amp; filter &#x2705;</text>
  <text x="125" y="1330" class="cardBody">Parse JSON, filter to allowed vocabulary (restricted mode), basic dedupe.</text>
  <text x="850" y="1310" text-anchor="end" class="cardTitle">&#x2705;</text>
  <path d="M490 1395 L490 1425" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
  <path d="M490 1425 l-10 -12 M490 1425 l10 -12" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>

  <!-- 7 Merge ontology -->
  <g filter="url(#shadow)">
    <rect x="90" y="1435" width="800" height="120" rx="22" fill="#ffffff"/>
    <rect x="90" y="1435" width="12" height="120" rx="22" fill="#f97316"/>
  </g>
  <text x="125" y="1477" class="cardTitle">7. Merge ontology &#x1F517;</text>
  <text x="125" y="1510" class="cardBody">Merge all chunk outputs into one ontology (classes/relations/hierarchy).</text>
  <text x="850" y="1490" text-anchor="end" class="cardTitle">&#x1F517;</text>
  <path d="M490 1575 L490 1605" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <path d="M490 1605 l-10 -12 M490 1605 l10 -12" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>

  <!-- 8 Post-processing improvements -->
  <g filter="url(#shadow)">
    <rect x="90" y="1615" width="800" height="170" rx="22" fill="#ffffff"/>
    <rect x="90" y="1615" width="12" height="170" rx="22" fill="#7c3aed"/>
  </g>
  <text x="125" y="1657" class="cardTitle">8. Post-processing improvements &#x1F6E0;&#xFE0F;</text>
  <text x="125" y="1685" class="cardBody">Order: Text-grounded completion → Cleanup → SGC → Rule-based. Modes 1–3.</text>
  <rect x="125" y="1700" width="175" height="28" rx="14" fill="#7c3aed"/>
  <text x="212" y="1719" text-anchor="middle" class="pillText">Schema-guided completion</text>
  <rect x="310" y="1700" width="140" height="28" rx="14" fill="#6d28d9"/>
  <text x="380" y="1719" text-anchor="middle" class="pillText">Built-in cleanup</text>
  <rect x="460" y="1700" width="195" height="28" rx="14" fill="#5b21b6"/>
  <text x="557" y="1719" text-anchor="middle" class="pillText">Text-grounded Completion</text>
  <rect x="665" y="1700" width="195" height="28" rx="14" fill="#4c1d95"/>
  <text x="762" y="1719" text-anchor="middle" class="pillText">Rule-based reasoning</text>
  <text x="850" y="1690" text-anchor="end" class="cardTitle">&#x1F39B;&#xFE0F;</text>
  <path d="M490 1805 L490 1835" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
  <path d="M490 1835 l-10 -12 M490 1835 l10 -12" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>

  <!-- 9 Evaluation -->
  <g filter="url(#shadow)">
    <rect x="90" y="1845" width="800" height="120" rx="22" fill="#ffffff"/>
    <rect x="90" y="1845" width="12" height="120" rx="22" fill="#22c55e"/>
  </g>
  <text x="125" y="1887" class="cardTitle">9. Evaluation &#x1F4CA;</text>
  <text x="125" y="1920" class="cardBody">Align to gold and compute: coverage / precision / recall + structural + errors.</text>
  <text x="850" y="1900" text-anchor="end" class="cardTitle">&#x1F4C8;</text>
  <path d="M490 1985 L490 2015" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>
  <path d="M490 2015 l-10 -12 M490 2015 l10 -12" stroke="#22c55e" stroke-width="5" stroke-linecap="round"/>

  <!-- 10 Artefacts & reporting -->
  <g filter="url(#shadow)">
    <rect x="90" y="2025" width="800" height="120" rx="22" fill="#ffffff"/>
    <rect x="90" y="2025" width="12" height="120" rx="22" fill="#22c55e"/>
  </g>
  <text x="125" y="2067" class="cardTitle">10. Artefacts &amp; reporting &#x1F5C2;</text>
  <text x="125" y="2100" class="cardBody">Write: ontology.json, summary.txt, metrics.json, improvement_counts.json.</text>
  <text x="850" y="2080" text-anchor="end" class="cardTitle">&#x1F5C3;&#xFE0F;</text>

  <!-- Footer note -->
  <text x="490" y="2180" text-anchor="middle" class="footer">Gold &quot;restricted&quot; mode enables schema/vocab constraints.</text>
</svg>
